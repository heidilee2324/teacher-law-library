      <h1>今天想查什麼？</h1>
      <p>從書架挑一本書，或直接搜尋法規名稱和你遇到的情況。</p>

  <main class="tl-main tl-support" data-support hidden>
    <span class="tl-kicker">支持空間</span>
    <h1>我想先喘口氣</h1>
    <p>可以先停一會兒。等準備好了，再回去查你需要的資料。</p>
    <div class="tl-grid">
      <section class="tl-tile"><h2>整理現在的感受</h2><span>給自己一點時間，想想目前最需要哪一種支持。</span></section>
      <section class="tl-tile">
        <h2>找人說說</h2>
        <span>教育部主管學校的專任與代理教師可查看教師支持中心的服務。其他學校可向服務學校或教育主管機關查詢所在地的支持窗口。</span>
        <a class="tl-source" href="https://edu.law.moe.gov.tw/LawContent.aspx?id=GL001997" target="_blank" rel="noopener">教師諮商輔導支持體系設立辦法第 2、6、7 條</a>
      </section>
    </div>
    <button type="button" class="tl-primary" data-home>回圖書館</button>
  </main>
</section>
<style>
  #teacher-library-home {
    --tl-paper: #f7f4eb;
    --tl-ink: #253b32;
    --tl-muted: #4e6258;
    --tl-green: #264d3e;
    --tl-border: #d1d9ce;
    --tl-white: #fffdf7;
    color: var(--tl-ink);
    background: var(--tl-paper);
    border: 1px solid var(--tl-border);
    border-radius: 18px;
    font: 15px/1.55 "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  #teacher-library-home [hidden] { display: none !important; }
  #teacher-library-home * { box-sizing: border-box; }
  #teacher-library-home button, #teacher-library-home input, #teacher-library-home select { font: inherit; }
  #teacher-library-home button { color: inherit; }
  #teacher-library-home button:focus-visible, #teacher-library-home input:focus-visible,
  #teacher-library-home select:focus-visible { outline: 2px solid var(--tl-green); outline-offset: 3px; }
  #teacher-library-home .tl-header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px clamp(16px, 5vw, 52px); border-bottom: 1px solid var(--tl-border);
  }
  #teacher-library-home .tl-brand, #teacher-library-home .tl-nav {
    background: transparent; border: 0; padding: 8px 2px; min-height: 44px;
  }
  #teacher-library-home .tl-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  #teacher-library-home .tl-nav { color: var(--tl-green); text-decoration: underline; text-underline-offset: 4px; }
  #teacher-library-home .tl-main { padding: clamp(20px, 5vw, 46px) clamp(16px, 5vw, 52px); }
  #teacher-library-home .tl-kicker { color: var(--tl-muted); font-size: 13px; letter-spacing: .08em; }
  #teacher-library-home h1 {
    color: var(--tl-green); margin: 6px 0 4px; font: 600 clamp(30px, 5.2vw, 52px)/1.2
      "Noto Serif TC", "PMingLiU", serif;
  }
  #teacher-library-home p { color: var(--tl-muted); margin: 8px 0 0; }
  #teacher-library-home h2 { margin: 0; font: 700 18px/1.4 "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  #teacher-library-home .tl-search {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(130px, 170px) auto;
    gap: 12px; align-items: end; margin: 22px 0 28px;
  }
  #teacher-library-home label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; }
  #teacher-library-home input, #teacher-library-home select {
    width: 100%; min-height: 44px; padding: 8px 10px; color: var(--tl-ink);
    background: var(--tl-white); border: 1px solid #a7b5a9; border-radius: 8px; font-size: 16px;
  }
  #teacher-library-home input::placeholder { color: var(--tl-muted); }
  #teacher-library-home .tl-primary {
    background: var(--tl-green); color: var(--tl-white); border: 1px solid transparent;
    padding: 8px 16px; border-radius: 8px; min-height: 44px; font-weight: 600;
  }
  #teacher-library-home .tl-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 13px;
  }
  #teacher-library-home .tl-tile {
    display: grid; align-content: start; gap: 6px; text-align: start; min-width: 0;
    min-height: 105px; border-radius: 12px; border: 1px solid var(--tl-border);
    padding: 14px 15px; background: var(--tl-white); overflow-wrap: anywhere;
  }
  #teacher-library-home button.tl-tile:hover { border-color: var(--tl-green); }
  #teacher-library-home .tl-tile svg { width: 19px; height: 19px; color: var(--tl-green); }
  #teacher-library-home .tl-tile strong { font-size: 16px; font-weight: 700; }
  #teacher-library-home .tl-tile span { font-size: 13px; color: var(--tl-muted); }
  #teacher-library-home .tl-book-row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 176px));
    justify-content: center;
    align-items: end;
    gap: clamp(9px, 3vw, 34px);
    margin-top: 16px;
    padding: 0 clamp(6px, 5vw, 48px);
    border-bottom: 9px solid #af8868;
    border-radius: 0 0 3px 3px;
    box-shadow: 0 4px 0 #77573e, 0 8px 12px #77573e24;
  }
  #teacher-library-home .tl-book {
    --book-color: #284c3e;
    --book-text: #fff9e8;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    width: 100%;
    min-width: 0;
    min-height: 142px;
    padding: 15px 10px 13px clamp(12px, 2.3vw, 23px);
    border: 1px solid #46332545;
    border-radius: 3px 8px 8px 3px;
    background:
      linear-gradient(90deg, #0000002c 0 5px, #ffffff22 6px 8px, transparent 9px),
      var(--book-color);
    color: var(--book-text);
    text-align: start;
    overflow-wrap: anywhere;
    box-shadow: 3px 0 #e5d6bb, 5px 2px 7px #38251930;
    cursor: pointer;
  }
  #teacher-library-home .tl-book:hover { transform: translateY(-3px); }
  #teacher-library-home .tl-book-fern { --book-color: #48604d; }
  #teacher-library-home .tl-book-clay { --book-color: #704c3d; }
  #teacher-library-home .tl-book-oat { --book-color: #e5d7b9; --book-text: #3c382c; }
  #teacher-library-home .tl-book-rust { --book-color: #694337; }
  #teacher-library-home .tl-book-sage { --book-color: #d7e2d0; --book-text: #294236; }
  #teacher-library-home .tl-book svg { width: 21px; height: 21px; }
  #teacher-library-home .tl-book strong { font-size: clamp(14px, 2.2vw, 18px); line-height: 1.25; }
  #teacher-library-home .tl-book span { font-size: 12px; line-height: 1.4; }
  #teacher-library-home .tl-result-count { margin: 4px 0 13px; font-size: 13px; }
  #teacher-library-home .tl-catalog-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  #teacher-library-home .tl-entry {
    padding: 15px 17px; background: var(--tl-white); border: 1px solid var(--tl-border); border-radius: 9px;
    overflow-wrap: anywhere;
  }
  #teacher-library-home .tl-entry h3 { margin: 0; color: var(--tl-green); font-size: 16px; }
  #teacher-library-home .tl-entry .tl-plain { color: var(--tl-ink); }
  #teacher-library-home .tl-entry .tl-scope, #teacher-library-home .tl-entry .tl-kind { font-size: 13px; }
  #teacher-library-home .tl-entry .tl-sources { margin-top: 8px; padding-inline-start: 1.1em; }
  #teacher-library-home .tl-source { color: var(--tl-green); text-underline-offset: 3px; }
  #teacher-library-home .tl-support .tl-primary { margin-top: 20px; }
  @media (max-width: 610px) {
    #teacher-library-home .tl-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #teacher-library-home .tl-search { grid-template-columns: minmax(0, 1fr) auto; }

    function renderEntry(entry) {
      const row = document.createElement("li");
      row.className = "tl-entry";
      const heading = document.createElement("h3");
      heading.textContent = entry.title;
      const plain = document.createElement("p");
      plain.className = "tl-plain";
      plain.textContent = entry.summary;
      const scope = document.createElement("p");
      scope.className = "tl-scope";
      scope.textContent = entry.roles.length ? "適用範圍｜" + entry.scope : "個案背景｜" + entry.scope;
      const kind = document.createElement("p");
      kind.className = "tl-kind";
      kind.textContent = entry.kind + " · " + entry.shelf;
      const sources = document.createElement("ul");
      sources.className = "tl-sources";
      for (const source of entry.sources) {
        const item = document.createElement("li");
        const link = document.createElement("a");
        link.className = "tl-source";
        link.href = source.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = source.label;
        item.append(link);
        sources.append(item);
      }
      row.append(heading, plain, scope, kind, sources);
      return row;
    }

    function showResults(title, entries) {
      resultTitle.textContent = title;
      resultCount.textContent = entries.length
        ? entries.length + " 筆館藏 · 法源查證 " + catalog.checked
        : "沒有符合的條目。可以換個關鍵字，或把身分切回「全部身分」。";
      resultList.replaceChildren(...entries.map(renderEntry));
      shelves.hidden = true;
      results.hidden = false;
      results.querySelector("button").focus();
    }

    function showHome() {
      support.hidden = true;
      main.hidden = false;
      results.hidden = true;
      shelves.hidden = false;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const keywords = form.elements.query.value.normalize("NFKC").trim().toLowerCase().split(/\s+/).filter(Boolean);
      const role = form.elements.role.value;
      showResults("查館藏結果", catalog.entries.filter((entry) => {
        const text = [
          entry.title, entry.shelf, entry.summary, entry.scope, entry.terms,
          ...entry.roles, ...entry.sources.map((source) => source.label)
        ].join(" ").normalize("NFKC").toLowerCase();
        return (!role || entry.roles.includes(role)) && keywords.every((word) => text.includes(word));
      }));
    });
    library.querySelectorAll("[data-shelf]").forEach((button) => {
      button.addEventListener("click", () => {
        const shelf = button.dataset.shelf;
        const role = form.elements.role.value;
        showResults(shelf, catalog.entries.filter((entry) => entry.shelf === shelf && (!role || entry.roles.includes(role))));
      });
    });
    library.querySelectorAll("[data-breathe]").forEach((button) => {
      button.addEventListener("click", () => {
        main.hidden = true;
        support.hidden = false;
        support.querySelector("button").focus();
      });
    });
    library.querySelectorAll("[data-home], [data-clear]").forEach((button) => {
      button.addEventListener("click", () => {
        showHome();
        form.elements.query.focus();
      });
    });
  }
